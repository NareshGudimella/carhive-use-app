name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # react-native-auto-height-image declares a React 17 peer dependency, so a
      # strict install fails; --legacy-peer-deps matches how the lock file was made.
      - run: npm ci --legacy-peer-deps

      - run: npx tsc --noEmit

      # The codebase has ~50 pre-existing lint errors (mostly unused variables).
      # Non-blocking until they are cleaned up; remove continue-on-error then.
      - run: npm run lint
        continue-on-error: true

      - run: npm test -- --ci
